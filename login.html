<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
        }

        body{
            background:#eef2f7;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-container{
            width:400px;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,0.1);
        }

        .login-header{
            text-align:center;
            margin-bottom:25px;
        }

        .login-header h1{
            color:#2563eb;
            margin-bottom:8px;
        }

        .login-header p{
            color:#6b7280;
            font-size:14px;
        }

        .form-group{
            margin-bottom:18px;
        }

        .form-group label{
            display:block;
            margin-bottom:6px;
            color:#374151;
            font-weight:600;
        }

        .form-group input{
            width:100%;
            padding:10px;
            border:1px solid #d1d5db;
            border-radius:6px;
            font-size:14px;
        }

        .login-btn{
            width:100%;
            background:#2563eb;
            color:white;
            border:none;
            padding:12px;
            border-radius:6px;
            cursor:pointer;
            font-size:15px;
            font-weight:600;
        }

        .login-btn:hover{
            background:#1d4ed8;
        }

        .error{
            color:red;
            margin-top:12px;
            text-align:center;
            font-size:14px;
        }

        
    </style>
</head>
<body>

    <div class="login-container">

        <div class="login-header">
            <h1>Inventory Monitor</h1>
            <p>Staff / Admin Login</p>
        </div>

        <form id="login-form">

            <div class="form-group">
                <label>Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter Username"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    required
                >
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <p id="error-message" class="error"></p>

        

    </div>

    <script>
        document
        .getElementById("login-form")
        .addEventListener("submit", function(event){

            event.preventDefault();

            const username =
                document.getElementById("username").value;

            const password =
                document.getElementById("password").value;

           if(
    username === "staff" &&
    password === "staff123"
){

    localStorage.setItem(
        "loggedIn",
        "true"
    );

    localStorage.setItem(
        "role",
        "staff"
    );

    window.location.href =
        "index.html";
}

else if(
    username === "admin" &&
    password === "admin123"
){

    localStorage.setItem(
        "loggedIn",
        "true"
    );

    localStorage.setItem(
        "role",
        "admin"
    );

    window.location.href =
        "index.html";
}

else{

    document
    .getElementById("error-message")
    .textContent =
        "Invalid Username or Password";
}
        });
    </script>

</body>
</html>
