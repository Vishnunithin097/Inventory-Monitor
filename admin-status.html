<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Allocation Status</title>
    <link rel="stylesheet" href="index.css">
    <style>
        .admin-header {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .admin-header h1 {
            font-size: 38px;
            color: white;
        }

        .admin-header p {
            font-size: 14px;
            color: rgba(255,255,255,0.8);
            margin-top: 8px;
        }

        .status-section {
            background: #ffffff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            margin-bottom: 24px;
        }

        .status-section h2 {
            margin-bottom: 20px;
            color: #1f2937;
        }

        .status-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .status-table thead {
            background: #f3f4f6;
        }

        .status-table th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #374151;
            border-bottom: 2px solid #e5e7eb;
        }

        .status-table td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
        }

        .status-table tbody tr:hover {
            background: #f9fafb;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-pending { background: #fef3c7; color: #92400e; }
        .status-approved { background: #d1fae5; color: #065f46; }
        .status-rejected { background: #fee2e2; color: #7f1d1d; }

        .comment-text {
            font-style: italic;
            color: #4b5563;
            font-size: 13px;
        }

        .logout-btn {
            float: right;
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .logout-btn:hover { background: #dc2626; }
        .empty-state { text-align: center; padding: 60px 20px; color: #9ca3af; }
    </style>
</head>
<body>
    <div class="dashboard">
        <header class="admin-header">
            <button class="logout-btn" onclick="logout()">Logout</button>
            <h1>Admin Audit Console</h1>
            <p>Real-Time Tracking of SQL Request Allocation Pipelines</p>
        </header>

        <section class="status-section">
            <h2>Track Active Allocations</h2>
            <button onclick="goToInventory()" style="background: #6b7280; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; margin-bottom: 15px; margin-right: 10px;">
                &larr; Back to Inventory
            </button>
            <button onclick="fetchAuditLogs()" style="background: #3b82f6; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; margin-bottom: 15px;">
                Refresh Tracking Logs
            </button>

            <div id="status-container">
                <table class="status-table" id="status-table" style="display: none;">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Target Employee Name</th>
                            <th>Allocated Products</th>
                            <th>Justification Reason</th>
                            <th>Date Dispatched</th>
                            <th>Live Status</th>
                            <th>Staff Feedback / Comments</th>
                        </tr>
                    </thead>
                    <tbody id="status-body">
                    </tbody>
                </table>
                <div class="empty-state" id="empty-state">
                    <p>No logged tracking instances found.</p>
                </div>
            </div>
        </section>
    </div>

    <script>
        // Restrict page view execution parameters to verified admin authorization metrics
        if (localStorage.getItem("loggedIn") !== "true" || localStorage.getItem("role") !== "admin") {
            window.location.href = "login.html";
        }

        const REST_URL = 'http://localhost:5000/api/requests';

        document.addEventListener('DOMContentLoaded', () => {
            fetchAuditLogs();
        });

        async function fetchAuditLogs() {
            try {
                const response = await fetch(REST_URL);
                if (!response.ok) throw new Error('API request structural stream crash');
                const dataset = await response.json();
                renderStatusTable(dataset);
            } catch (error) {
                console.error("Audit log error:", error);
                alert("Failed to pull live compilation logs from the SQL database registry.");
            }
        }

        function renderStatusTable(data) {
            const table = document.getElementById('status-table');
            const tbody = document.getElementById('status-body');
            const emptyState = document.getElementById('empty-state');

            if (!data || data.length === 0) {
                table.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            table.style.display = 'table';
            emptyState.style.display = 'none';
            tbody.innerHTML = '';

            data.forEach(item => {
                const row = document.createElement('tr');
                
                let badgeClass = 'status-pending';
                if (item.status === 'Approved') badgeClass = 'status-approved';
                if (item.status === 'Rejected') badgeClass = 'status-rejected';

                let productsList = Array.isArray(item.products) ? item.products.join(', ') : '';
                let timestamp = item.date ? new Date(item.date).toLocaleString() : 'Pending';
                let commentContent = item.rejectionReason ? item.rejectionReason : '<span style="color:#9ca3af;">No comment written</span>';

                row.innerHTML = `
                    <td><strong>#${item.id}</strong></td>
                    <td>${item.employeeName}</td>
                    <td>${productsList}</td>
                    <td>${item.reason}</td>
                    <td>${timestamp}</td>
                    <td><span class="status-badge ${badgeClass}">${item.status}</span></td>
                    <td class="comment-text">${commentContent}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function goToInventory() { window.location.href = "index.html"; }
        function logout() {
            localStorage.clear();
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
